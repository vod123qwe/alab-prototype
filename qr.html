<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALAB • Prototyp na telefonie</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #04387c; color: #fff; font: 600 15px/22px "Manrope", system-ui, sans-serif; }
  .card { background: #fff; color: #0e141c; border-radius: 24px; padding: 32px; width: min(92vw, 420px); text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.3); }
  h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.02em; font-weight: 800; }
  p { margin: 0 0 20px; color: #515862; }
  #qr { display: inline-block; padding: 12px; border: 1px solid #e2e2e2; border-radius: 16px; }
  #qr img, #qr canvas { display: block; }
  code { display: block; margin-top: 16px; font: 14px ui-monospace, Consolas, monospace; background: #f6f7f8; padding: 10px 12px; border-radius: 10px; word-break: break-all; }
  .warn { margin-top: 18px; font-size: 13px; color: #6e7283; text-align: left; }
  .links { margin-top: 14px; display: flex; gap: 8px; justify-content: center; }
  .links a { color: #096bcd; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <h1>Otwórz prototyp na telefonie</h1>
  <p>Zeskanuj kod aparatem. Telefon musi być w tej samej sieci Wi-Fi co ten komputer.</p>
  <div id="qr"></div>
  <code id="url"></code>
  <div class="links"><a href="app/index.html">Prototyp</a> · <a href="storybook/index.html">Storybook</a></div>
  <div class="warn" id="warn"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const url = location.origin + location.pathname.replace(/qr\.html$/, '') + 'app/index.html';
  document.getElementById('url').textContent = url;
  new QRCode(document.getElementById('qr'), { text: url, width: 220, height: 220, colorDark: '#04387c', correctLevel: QRCode.CorrectLevel.M });
  if (/localhost|127\.0\.0\.1/.test(location.hostname)) {
    document.getElementById('warn').textContent = 'Ta strona jest otwarta przez localhost, więc kod zaprowadzi tylko na ten komputer. Odpal serve.bat albo wejdź przez adres IP komputera (np. http://192.168.1.15:8802/qr.html).';
  } else {
    document.getElementById('warn').textContent = 'Na iPhonie: Udostępnij → „Do ekranu początkowego”, żeby prototyp działał na pełnym ekranie bez paska Safari.';
  }
</script>
</body>
</html>
